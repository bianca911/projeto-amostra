<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POCS Books</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Sansita+One" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="titulos">
        <div class="tittle">
            <div class="color2">
                <h3>POCS</h3>
            </div>
            <div class="color1">
                <h1>BOOKS</h1>
            </div>
        </div>
        <div class="tittle2">
            <p>Quais são seus interesses? ;)</p>
        </div>
    </div>
    
   
    
    <div class="search">
        <input type="text" id="searchInput" placeholder="Ex: romance, ficção, fantasia, mangá etc">
        <label for="searchInput">
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </label>
    </div>

    <div class="card-container" id="bookResults">
        <!-- Os livros aparecerão aqui -->
    </div>
    
    <script src="./script.js" defer></script>
</body>
</html>
